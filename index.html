<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafana POS</title>

<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f2f2;margin:0;padding:12px}
h2,h3{margin:6px 0}
button{border:none;border-radius:18px;padding:14px 20px;margin:6px;background:#1976d2;color:white;font-size:18px;cursor:pointer}
button.green{background:#388e3c}
button.red{background:#d32f2f}
.masa{display:inline-flex;justify-content:center;align-items:center;width:120px;height:90px;margin:8px;background:white;border-radius:18px;font-weight:bold;font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,.25);cursor:pointer}
.zafatena{background:#ffcc80}
.item{background:white;padding:12px;margin:6px 0;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
input,select{padding:6px;border-radius:8px;border:1px solid #ccc;width:100%;margin:4px 0}
.total{font-size:20px;font-weight:bold;text-align:right}
.dropdown{background:#e0e0e0;border-radius:14px;padding:12px;margin-top:8px;cursor:pointer;font-weight:bold}
.dropdown-items{display:none}
.dropdown.open + .dropdown-items{display:block}
</style>
</head>

<body>

<!-- МАСИ -->
<div id="screenMasi">
<h2>Маси</h2>
<h3>Дневен промет: <span id="promet">0</span> ден</h3>
<button onclick="openReport()">📊 Извештај</button>
<button onclick="openPopis()">📦 Попис</button>
<div id="masi"></div>
</div>

<!-- МАСА -->
<div id="screenMasa" style="display:none">
<button onclick="backToMasi()">⬅ Маси</button>
<h3 id="masaTitle"></h3>
<div id="items"></div>
<div class="total">Вкупно: <span id="total">0</span> ден</div>
<button class="green" onclick="openMenu()">➕ Додај</button>
<button class="red" onclick="clearMasa()">💰 Плати</button>
</div>

<!-- МЕНИ -->
<div id="screenMenu" style="display:none">
<button onclick="backToMasa()">⬅ Назад</button>
<h3>Мени</h3>
<div id="menu"></div>
</div>

<!-- POPIS -->
<div id="screenPopis" style="display:none">
<button onclick="backFromPopis()">⬅ Назад</button>
<h3>Попис</h3>
<div id="popisList"></div>
</div>

<!-- ИЗВЕШТАЈ -->
<div id="screenReport" style="display:none">
<button onclick="backFromReport()">⬅ Назад</button>
<h3>Извештај по ден</h3>
<input type="date" id="reportDate" onchange="renderReport()">
<div id="reportContent"></div>
</div>

<script>
// ================= МЕНИ (СКРАТЕНО ЗА ПРИМЕР – ТИ ГО ИМАШ ЦЕЛОСНОТО) =================
const menu={
 "Пиво":[{id:1,name:"Скопско",price:90}],
 "Скара":[{id:57,name:"Крилца",price:220}]
};

// ================= POPIS =================
let popis=JSON.parse(localStorage.getItem("popis"))||{};

function initPopis(){
 for(let cat in menu){
  menu[cat].forEach(it=>{
   if(!popis[it.id]){
    popis[it.id]={
     id:it.id,
     name:it.name,
     unit:"gram",
     stock:0,
     packSize:0,
     buyPrice:0,
     sellQty:0,
     sellPrice:it.price
    };
   }
  });
 }
 savePopis();
}

function savePopis(){localStorage.setItem("popis",JSON.stringify(popis));}

function openPopis(){
 screenMasi.style.display="none";
 screenPopis.style.display="block";
 renderPopis();
}
function backFromPopis(){
 screenPopis.style.display="none";
 screenMasi.style.display="block";
}

function renderPopis(){
 const d=document.getElementById("popisList");
 d.innerHTML="";
 Object.values(popis).forEach(p=>{
  d.innerHTML+=`
  <div class="item">
   <b>${p.name}</b>
   <label>Залиха (пакети / парчиња)</label>
   <input type="number" value="${p.stock}" onchange="pUpd(${p.id},'stock',this.value)">
   <label>Единица</label>
   <select onchange="pUpd(${p.id},'unit',this.value)">
    <option value="gram" ${p.unit=="gram"?"selected":""}>gram</option>
    <option value="piece" ${p.unit=="piece"?"selected":""}>piece</option>
   </select>
   <label>1 пакет има</label>
   <input type="number" value="${p.packSize}" onchange="pUpd(${p.id},'packSize',this.value)">
   <label>Набавна цена (1 пакет)</label>
   <input type="number" value="${p.buyPrice}" onchange="pUpd(${p.id},'buyPrice',this.value)">
   <label>Продажна порција</label>
   <input type="number" value="${p.sellQty}" onchange="pUpd(${p.id},'sellQty',this.value)">
   <label>Продажна цена</label>
   <input type="number" value="${p.sellPrice}" onchange="pUpd(${p.id},'sellPrice',this.value)">
  </div>`;
 });
}

function pUpd(id,key,val){
 popis[id][key]=(key=="unit")?val:Number(val);
 savePopis();
}

// ================= МАСИ =================
let masi=JSON.parse(localStorage.getItem("masi"))||
 Array.from({length:8},(_,i)=>({broj:i+1,naracki:[]}));
let current=0;

function renderMasi(){
 const d=document.getElementById("masi");d.innerHTML="";
 masi.forEach((m,i)=>{
  const div=document.createElement("div");
  div.className="masa"+(m.naracki.length?" zafatena":"");
  div.innerText="Маса "+m.broj;
  div.onclick=()=>openMasa(i);
  d.appendChild(div);
 });
}
renderMasi();

function openMasa(i){
 current=i;
 screenMasi.style.display="none";
 screenMasa.style.display="block";
 masaTitle.innerText="Маса "+masi[i].broj;
 renderMasa();
}
function backToMasi(){save();screenMasa.style.display="none";screenMasi.style.display="block";renderMasi();}

function openMenu(){screenMasa.style.display="none";screenMenu.style.display="block";renderMenu();}
function backToMasa(){screenMenu.style.display="none";screenMasa.style.display="block";renderMasa();}

function renderMenu(){
 const m=document.getElementById("menu");m.innerHTML="";
 for(let cat in menu){
  m.innerHTML+=`<div class="dropdown" onclick="this.classList.toggle('open')">${cat}</div><div class="dropdown-items"></div>`;
 }
 document.querySelectorAll(".dropdown").forEach((d,i)=>{
  const cat=Object.keys(menu)[i];
  const c=d.nextElementSibling;
  menu[cat].forEach(it=>{
   c.innerHTML+=`<button class="green" onclick="addItem(${it.id})">${it.name}<br>${it.price} ден</button>`;
  });
 });
}

function addItem(id){
 const p=popis[id];
 let n=masi[current].naracki.find(x=>x.id===id);
 if(n) n.qty++;
 else masi[current].naracki.push({id:id,name:p.name,price:p.sellPrice,qty:1});
 renderMasa();save();
}

function renderMasa(){
 const d=document.getElementById("items");d.innerHTML="";
 let t=0;
 masi[current].naracki.forEach(n=>{
  t+=n.qty*n.price;
  d.innerHTML+=`<div class="item">${n.name} × ${n.qty} = ${n.qty*n.price} ден</div>`;
 });
 total.innerText=t;
}

// ================= ИЗВЕШТАЈ =================
function reportKey(d){return"report-"+d;}

function clearMasa(){
 const date=new Date().toISOString().slice(0,10);
 let data=JSON.parse(localStorage.getItem(reportKey(date)))||{};
 masi[current].naracki.forEach(n=>{
  const p=popis[n.id];
  const used=n.qty*p.sellQty;
  const cost=(p.buyPrice/p.packSize)*used;
  p.stock-=used/p.packSize;
  if(!data[p.name])data[p.name]={qty:0,income:0,cost:0};
  data[p.name].qty+=n.qty;
  data[p.name].income+=n.qty*n.price;
  data[p.name].cost+=cost;
 });
 savePopis();
 localStorage.setItem(reportKey(date),JSON.stringify(data));
 masi[current].naracki=[];
 save();backToMasi();
}

function openReport(){
 screenMasi.style.display="none";
 screenReport.style.display="block";
 reportDate.value=new Date().toISOString().slice(0,10);
 renderReport();
}
function backFromReport(){
 screenReport.style.display="none";
 screenMasi.style.display="block";
}
function renderReport(){
 const d=document.getElementById("reportContent");
 d.innerHTML="";
 const date=reportDate.value;
 const data=JSON.parse(localStorage.getItem(reportKey(date)));
 if(!data){d.innerHTML="Нема податоци";return;}
 for(let k in data){
  const x=data[k];
  d.innerHTML+=`
   <div class="item">
    <b>${k}</b><br>
    Продадени: ${x.qty}<br>
    Приход: ${x.income.toFixed(0)}<br>
    Трошок: ${x.cost.toFixed(0)}<br>
    Профит: ${(x.income-x.cost).toFixed(0)}
   </div>`;
 }
}

function save(){localStorage.setItem("masi",JSON.stringify(masi));}
initPopis();
</script>
</body>
</html>
