<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafana POS + Popis</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f2f2;margin:0;padding:12px;}
h2,h3{margin:6px 0;}
.masa{display:inline-flex;justify-content:center;align-items:center;width:120px;height:90px;margin:8px;background:white;border-radius:18px;font-weight:bold;font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,0.25);cursor:pointer;transition:0.2s;}
.zafatena{background:#ffcc80;}
button{border:none;border-radius:18px;padding:14px 20px;margin:6px;background:#1976d2;color:white;font-size:20px;cursor:pointer;}
button.green{background:#388e3c;}
button.red{background:#d32f2f;}
.item{background:white;padding:14px;margin:8px 0;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,0.15);display:flex;justify-content:space-between;align-items:center;font-size:18px;}
.total{font-size:22px;font-weight:bold;margin-top:12px;text-align:right;}
input,select{padding:6px;border-radius:8px;border:1px solid #aaa;margin:2px;}
</style>
</head>
<body>

<h2>Kafana POS</h2>
<div id="screenMasi">
  <h2>Маси</h2>
  <h3>Дневен промет: <span id="promet">0</span> ден</h3>
  <button onclick="openReport()">📊 Извештај</button>
  <button onclick="openPopis()">📋 Попис</button>
  <div id="masi"></div>
</div>

<div id="screenMasa" style="display:none">
  <button onclick="backToMasi()">⬅ Маси</button>
  <h3 id="masaTitle"></h3>
  <div id="items"></div>
  <div class="total">Вкупно: <span id="total">0</span> ден</div>
  <button class="green" onclick="openMenu()">➕ Додај</button>
  <button class="red" onclick="clearMasa()">💰 Плати</button>
</div>

<div id="screenMenu" style="display:none">
  <button onclick="backToMasa()">⬅ Назад</button>
  <h3>Мени</h3>
  <div id="menu"></div>
</div>

<div id="screenPopis" style="display:none">
  <button onclick="backFromPopis()">⬅ Назад</button>
  <h3>Попис на артикли</h3>
  <div id="popis"></div>
</div>

<div id="screenReport" style="display:none">
  <button onclick="backFromReport()">⬅ Назад</button>
  <h3>Дневен извештај</h3>
  <input type="date" id="reportDate" onchange="renderReport()"/>
  <div id="reportContent"></div>
</div>

<script>
// ===== МЕНИ
const menu = [
  {id:1,name:"Скопско",unit:"парче"},
  {id:2,name:"Крилца",unit:"грам"},
  {id:3,name:"Ребро",unit:"грам"},
  {id:4,name:"Плескавица",unit:"парче"}
];

// ===== ПОПИС
let popis = JSON.parse(localStorage.getItem("popis")) || menu.map(a=>({
  id:a.id,name:a.name,unit:a.unit,kupeno:0,nabavna:0,prodazba:0,cenaProdazba:0,zalih:0
}));
function savePopis(){ localStorage.setItem("popis",JSON.stringify(popis)); }
function openPopis(){ document.getElementById("screenPopis").style.display="block"; renderPopis(); }
function backFromPopis(){ document.getElementById("screenPopis").style.display="none"; savePopis(); }
function renderPopis(){
  const d = document.getElementById("popis"); d.innerHTML="";
  popis.forEach((p,i)=>{
    d.innerHTML+=`
      <div class="item">
        <strong>${p.name}</strong>
        <br>Единица: <select onchange="updateUnit(${i},this.value)">
          <option value="парче"${p.unit=='парче'?' selected':''}>парче</option>
          <option value="грам"${p.unit=='грам'?' selected':''}>грам</option>
        </select>
        <br>Колку купувам: <input type="number" value="${p.kupeno}" onchange="updateKupeno(${i},this.value)">
        <br>Набавна цена: <input type="number" value="${p.nabavna}" onchange="updateNabavna(${i},this.value)">
        <br>Колку продаваме: <input type="number" value="${p.prodazba}" onchange="updateProdazba(${i},this.value)">
        <br>Цена продажба: <input type="number" value="${p.cenaProdazba}" onchange="updateCena(${i},this.value)">
        <br>Залиха (пакети): <input type="number" value="${p.zalih}" onchange="updateZalih(${i},this.value)">
        <br>Вкупна залиха: ${p.kupeno*p.zalih}
      </div><hr>
    `;
  });
}
function updateUnit(i,v){ popis[i].unit=v; savePopis(); renderPopis(); }
function updateKupeno(i,v){ popis[i].kupeno=Number(v); savePopis(); renderPopis(); }
function updateNabavna(i,v){ popis[i].nabavna=Number(v); savePopis(); renderPopis(); }
function updateProdazba(i,v){ popis[i].prodazba=Number(v); savePopis(); renderPopis(); }
function updateCena(i,v){ popis[i].cenaProdazba=Number(v); savePopis(); renderPopis(); }
function updateZalih(i,v){ popis[i].zalih=Number(v); savePopis(); renderPopis(); }

// ===== МАСИ
let masi = JSON.parse(localStorage.getItem("masi")) || Array.from({length:8},(_,i)=>({broj:i+1,naracki:[]}));
let current=0;
function todayKey(){ return "promet-"+new Date().toISOString().slice(0,10); }
function getPromet(){ return Number(localStorage.getItem(todayKey()))||0; }
function addPromet(x){ localStorage.setItem(todayKey(),getPromet()+x); renderPromet(); }
function renderPromet(){ document.getElementById("promet").innerText=getPromet(); }
renderMasi();
function renderMasi(){ const d=document.getElementById("masi"); d.innerHTML=""; masi.forEach((m,i)=>{let div=document.createElement("div");div.className="masa"+(m.naracki.length?" zafatena":"");div.innerText="Маса "+m.broj;div.onclick=()=>openMasa(i);d.appendChild(div);});}
function openMasa(i){ current=i; screenMasi.style.display="none"; screenMasa.style.display="block"; masaTitle.innerText="Маса "+masi[i].broj; renderMasa();}
function backToMasi(){ save(); screenMasa.style.display="none"; screenMasi.style.display="block"; renderMasi();}
function openMenu(){ screenMasa.style.display="none"; screenMenu.style.display="block"; renderMenu();}
function backToMasa(){ screenMenu.style.display="none"; screenMasa.style.display="block"; renderMasa();}

// ===== МЕНИ
function renderMenu(){ const m=document.getElementById("menu"); m.innerHTML=""; menu.forEach(it=>{ m.innerHTML+=`<div class="menu-item"><button class="green" onclick="addItem(${it.id})">${it.name}</button></div>`;});}
function addItem(id){ let masa=masi[current]; let item = menu.find(x=>x.id===id); let n=masa.naracki.find(x=>x.id===id); if(n) n.qty++; else masa.naracki.push({...item,qty:1}); save(); renderMasa();}
function renderMasa(){ const d=document.getElementById("items"); d.innerHTML=""; let total=0; masi[current].naracki.forEach((n,i)=>{ let p=popis.find(x=>x.id===n.id); let price=p? p.cenaProdazba : 0; total+=n.qty*price; d.innerHTML+=`<div class="item">${n.name} <button onclick="changeQty(${i},-1)">−</button> ${n.qty} <button onclick="changeQty(${i},1)">+</button> ${n.qty*price} ден</div>`; }); document.getElementById("total").innerText=total;}
function changeQty(i,d){ let n=masi[current].naracki[i]; n.qty+=d; if(n.qty<=0) masi[current].naracki.splice(i,1); renderMasa(); save();}

// ===== ПЛАТИ
function clearMasa(){
  if(confirm("Да се наплати масата?")){
    let s=0;
    let sold = masi[current].naracki;
    sold.forEach(n=>{
      let p = popis.find(x=>x.id===n.id);
      if(!p) return;
      let totalSold = n.qty*p.prodazba;
      let remaining = p.kupeno*p.zalih - totalSold;
      p.zalih = Math.floor(remaining / p.kupeno);
      s += n.qty * p.cenaProdazba;
    });
    savePopis(); saveReport(sold); addPromet(s);
    masi[current].naracki=[]; save(); backToMasi();
  }
}

function save(){ localStorage.setItem("masi",JSON.stringify(masi));}

// ===== ИЗВЕШТАЈ
function reportKey(date){ return "report-"+date; }
function saveReport(sold){
  const date = new Date().toISOString().slice(0,10);
  let data = JSON.parse(localStorage.getItem(reportKey(date))) || [];
  sold.forEach(n=>{
    let p = popis.find(x=>x.id===n.id); if(!p) return;
    let totalQty = n.qty*p.prodazba;
    let prihod = n.qty*p.cenaProdazba;
    let trosok = (totalQty/p.kupeno)*p.nabavna;
    data.push({name:p.name,prihod:prihod,trosok:trosok,profit:prihod-trosok});
  });
  localStorage.setItem(reportKey(date),JSON.stringify(data));
}
function openReport(){ document.getElementById("screenMasi").style.display="none"; document.getElementById("screenReport").style.display="block"; document.getElementById("reportDate").value=new Date().toISOString().slice(0,10); renderReport(); }
function backFromReport(){ document.getElementById("screenReport").style.display="none"; document.getElementById("screenMasi").style.display="block"; }
function renderReport(){
  const date=document.getElementById("reportDate").value; const c=document.getElementById("reportContent"); c.innerHTML=""; 
  const data=JSON.parse(localStorage.getItem(reportKey(date))); if(!data || data.length==0){ c.innerHTML="<p>Нема податоци за овој ден</p>"; return; }
  let totalPrihod=0,totalTrosok=0,totalProfit=0;
  data.forEach(x=>{ c.innerHTML+=`<div class="item">${x.name} – приход: ${x.prihod} ден, трошок: ${x.trosok} ден, профит: ${x.profit} ден</div>`; totalPrihod+=x.prihod; totalTrosok+=x.trosok; totalProfit+=x.profit;});
  c.innerHTML+=`<div class="total">Вкупно приход: ${totalPrihod} ден<br>Вкупно трошок: ${totalTrosok} ден<br>Вкупно профит: ${totalProfit} ден</div>`;
}
</script>
</body>
</html>
