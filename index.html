
<!DOCTYPE html>
<html lang="mk">
<head>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">

<script>
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('service-worker.js');
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafana POS</title>

<style>
body{
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 background:#f2f2f2;
 margin:0; padding:12px;
}
h2,h3{ margin:6px 0; }

.masa{
 display:inline-flex;
 justify-content:center;
 align-items:center;
 width:120px;
 height:90px;
 margin:8px;
 background:white;
 border-radius:18px;
 font-weight:bold;
 font-size:20px;
 box-shadow:0 4px 10px rgba(0,0,0,0.25);
 cursor:pointer;
}
.zafatena{ background:#ffcc80; }

button{
 border:none;
 border-radius:18px;
 padding:14px 20px;
 margin:6px;
 background:#1976d2;
 color:white;
 font-size:20px;
 cursor:pointer;
}
button.green{ background:#388e3c; }
button.red{ background:#d32f2f; }

.item{
 background:white;
 padding:14px;
 margin:8px 0;
 border-radius:16px;
 box-shadow:0 2px 8px rgba(0,0,0,0.15);
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:18px;
 flex-wrap:wrap;
}

.total{
 font-size:22px;
 font-weight:bold;
 margin-top:12px;
 text-align:right;
}

.dropdown{
 background:#e0e0e0;
 border-radius:16px;
 margin-top:12px;
 padding:16px;
 font-size:22px;
 font-weight:bold;
 display:flex;
 justify-content:space-between;
 cursor:pointer;
}
.dropdown-items{ display:none; margin-top:10px; }
.dropdown.open + .dropdown-items{ display:block; }
.menu-item{ display:inline-block; margin:6px; }

input{ width:80px; }
</style>
</head>

<body>

<!-- МАСИ -->
<div id="screenMasi">
 <h2>Маси</h2>
 <h3>Дневен промет: <span id="promet">0</span> ден</h3>
 <button onclick="openReport()">📊 Извештај</button>
 <button onclick="openPopis()">📋 Попис</button>
 <div id="masi"></div>
</div>

<!-- МАСА -->
<div id="screenMasa" style="display:none">
 <button onclick="backToMasi()">⬅ Маси</button>
 <h3 id="masaTitle"></h3>
 <div id="items"></div>
 <div class="total">Вкупно: <span id="total">0</span> ден</div>
 <button class="green" onclick="openMenu()">➕ Додај</button>
 <button class="red" onclick="clearMasa()">💰 Плати</button>
</div>

<!-- МЕНИ -->
<div id="screenMenu" style="display:none">
 <button onclick="backToMasa()">⬅ Назад</button>
 <h3>Мени</h3>
 <div id="menu"></div>
</div>

<!-- ИЗВЕШТАЈ -->
<div id="screenReport" style="display:none">
 <button onclick="backFromReport()">⬅ Назад</button>
 <h3>Извештај</h3>
 <input type="date" id="reportDate" onchange="renderReport()">
 <div id="reportContent"></div>
</div>

<!-- ПОПИС -->
<div id="screenPopis" style="display:none">
 <button onclick="backFromPopis()">⬅ Назад</button>
 <h3>Попис</h3>
 <div id="popisList"></div>
</div>

<script>
/* ================== МЕНИ (НЕ Е МЕНУВАНО) ================== */
const menu = {
 "Пиво":[
  {id:1,name:"Скопско",price:90},
  {id:2,name:"Скопско Smooth",price:90},
  {id:3,name:"Хајнекен",price:110},
  {id:4,name:"Златен Даб",price:90},
  {id:5,name:"Горско",price:90},
  {id:6,name:"Туборг",price:110},
  {id:7,name:"Крали Марко",price:90}
 ],
 "Ракија":[
  {id:8,name:"Лозова Жолта Тиквеш",price:70},
  {id:9,name:"Св. Трифун",price:120},
  {id:10,name:"Бовин Жолта",price:90},
  {id:11,name:"Стомаклија",price:80},
  {id:12,name:"Мастика",price:80},
  {id:13,name:"Азбука",price:100},
  {id:14,name:"Узо",price:70},
  {id:15,name:"Вигор",price:60},
  {id:16,name:"Smirnoff",price:70}
 ]
};

/* ================== ПОПИС (ИСТИ АРТИКЛИ КАКО МЕНИ) ================== */
let popis = JSON.parse(localStorage.getItem("popis")) || {};
for(let cat in menu){
 menu[cat].forEach(it=>{
  if(!popis[it.id]) popis[it.id]={ stock:0 };
 });
}
localStorage.setItem("popis",JSON.stringify(popis));

/* ================== МАСИ ================== */
let masi = JSON.parse(localStorage.getItem("masi")) ||
 Array.from({length:8},(_,i)=>({broj:i+1,naracki:[]}));

let current=0;

/* ================== ПРОМЕТ ================== */
function todayKey(){ return "promet-"+new Date().toISOString().slice(0,10); }
function getPromet(){ return Number(localStorage.getItem(todayKey()))||0; }
function addPromet(x){ localStorage.setItem(todayKey(),getPromet()+x); renderPromet(); }
function renderPromet(){ document.getElementById("promet").innerText=getPromet(); }
renderPromet();

/* ================== МАСИ ================== */
function renderMasi(){
 const d=document.getElementById("masi"); d.innerHTML="";
 masi.forEach((m,i)=>{
  let div=document.createElement("div");
  div.className="masa"+(m.naracki.length?" zafatena":"");
  div.innerText="Маса "+m.broj;
  div.onclick=()=>openMasa(i);
  d.appendChild(div);
 });
}
renderMasi();

function openMasa(i){
 current=i;
 screenMasi.style.display="none";
 screenMasa.style.display="block";
 masaTitle.innerText="Маса "+masi[i].broj;
 renderMasa();
}
function backToMasi(){ save(); screenMasa.style.display="none"; screenMasi.style.display="block"; renderMasi(); }

/* ================== МЕНИ ================== */
function openMenu(){ screenMasa.style.display="none"; screenMenu.style.display="block"; renderMenu(); }
function backToMasa(){ screenMenu.style.display="none"; screenMasa.style.display="block"; renderMasa(); }

function renderMenu(){
 const m=document.getElementById("menu"); m.innerHTML="";
 Object.keys(menu).forEach(cat=>{
  m.innerHTML+=`<div class="dropdown" onclick="this.classList.toggle('open')">${cat}</div><div class="dropdown-items"></div>`;
 });
 document.querySelectorAll(".dropdown").forEach((d,i)=>{
  let c=d.nextElementSibling;
  let cat=Object.keys(menu)[i];
  menu[cat].forEach(it=>{
   c.innerHTML+=`<div class="menu-item"><button class="green" onclick="addItem(${it.id})">${it.name}<br>${it.price} ден</button></div>`;
  });
 });
}

/* ================== ДОДАВАЊЕ ================== */
function addItem(id){
 let item;
 for(let cat in menu){
  item=menu[cat].find(x=>x.id===id);
  if(item) break;
 }
 let n=masi[current].naracki.find(x=>x.id===id);
 if(n) n.qty++;
 else masi[current].naracki.push({...item,qty:1});
 popis[id].stock--;
 savePopis();
 save();
 renderMasa();
}

/* ================== МАСА ================== */
function renderMasa(){
 const d=document.getElementById("items"); d.innerHTML="";
 let total=0;
 masi[current].naracki.forEach((n,i)=>{
  total+=n.qty*n.price;
  d.innerHTML+=`
   <div class="item">
    ${n.name}
    <button onclick="changeQty(${i},-1)">−</button>
    ${n.qty}
    <button onclick="changeQty(${i},1)">+</button>
    ${n.qty*n.price} ден
   </div>`;
 });
 totalEl.innerText=total;
}

/* ================== ПЛАЌАЊЕ ================== */
function clearMasa(){
 let s=0;
 masi[current].naracki.forEach(n=>s+=n.qty*n.price);
 addPromet(s);
 masi[current].naracki=[];
 save();
 backToMasi();
}

/* ================== ПОПИС ================== */
function openPopis(){
 screenMasi.style.display="none";
 screenPopis.style.display="block";
 renderPopis();
}
function backFromPopis(){
 screenPopis.style.display="none";
 screenMasi.style.display="block";
}
function renderPopis(){
 const d=document.getElementById("popisList"); d.innerHTML="";
 for(let cat in menu){
  d.innerHTML+=`<h3>${cat}</h3>`;
  menu[cat].forEach(it=>{
   d.innerHTML+=`
    <div class="item">
     ${it.name}
     <input type="number" value="${popis[it.id].stock}"
      onchange="popis[${it.id}].stock=Number(this.value);savePopis()">
    </div>`;
  });
 }
}
function savePopis(){ localStorage.setItem("popis",JSON.stringify(popis)); }

function save(){ localStorage.setItem("masi",JSON.stringify(masi)); }
</script>

</body>
</html>
