<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafana POS</title>

<style>
body{
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 background:#f2f2f2;
 margin:0; padding:12px;
}
h2,h3{ margin:6px 0; }

.masa{
 display:inline-flex;
 justify-content:center;
 align-items:center;
 width:120px;
 height:90px;
 margin:8px;
 background:white;
 border-radius:18px;
 font-weight:bold;
 font-size:20px;
 box-shadow:0 4px 10px rgba(0,0,0,0.25);
 cursor:pointer;
}
.zafatena{ background:#ffcc80; }

button{
 border:none;
 border-radius:18px;
 padding:14px 20px;
 margin:6px;
 background:#1976d2;
 color:white;
 font-size:18px;
 cursor:pointer;
}
.green{ background:#388e3c; }
.red{ background:#d32f2f; }

.item{
 background:white;
 padding:14px;
 margin:8px 0;
 border-radius:16px;
 box-shadow:0 2px 8px rgba(0,0,0,0.15);
 font-size:16px;
}

.total{
 font-size:22px;
 font-weight:bold;
 text-align:right;
}

.dropdown{
 background:#e0e0e0;
 border-radius:16px;
 padding:14px;
 margin-top:10px;
 font-weight:bold;
 cursor:pointer;
}
.dropdown-items{ display:none; }
.dropdown.open + .dropdown-items{ display:block; }
</style>
</head>

<body>

<!-- МАСИ -->
<div id="screenMasi">
 <h2>Маси</h2>
 <h3>Дневен промет: <span id="promet">0</span> ден</h3>
 <button onclick="openReport()">📊 Извештај</button>
 <div id="masi"></div>
</div>

<!-- МАСА -->
<div id="screenMasa" style="display:none">
 <button onclick="backToMasi()">⬅ Маси</button>
 <h3 id="masaTitle"></h3>
 <div id="items"></div>
 <div class="total">Вкупно: <span id="total">0</span> ден</div>
 <button class="green" onclick="openMenu()">➕ Додај</button>
 <button class="red" onclick="clearMasa()">💰 Плати</button>
</div>

<!-- МЕНИ -->
<div id="screenMenu" style="display:none">
 <button onclick="backToMasa()">⬅ Назад</button>
 <h3>Мени</h3>
 <div id="menu"></div>
</div>

<!-- ИЗВЕШТАЈ -->
<div id="screenReport" style="display:none">
 <button onclick="backFromReport()">⬅ Назад</button>
 <button onclick="openInventory()">📋 Попис</button>
 <h3>Дневен извештај</h3>
 <input type="date" id="reportDate" onchange="renderReport()">
 <div id="reportContent"></div>
</div>

<!-- ПОПИС -->
<div id="screenInventory" style="display:none">
 <button onclick="backFromInventory()">⬅ Назад</button>
 <h3>📋 Попис / Залиха</h3>
 <div id="inventoryContent"></div>
</div>

<script>
// ===== МЕНИ =====
const menu = {
 "Скара":[
  {id:1,name:"Кебап",price:25},
  {id:2,name:"Ајдучки кебап",price:30},
  {id:3,name:"Плескавица",price:100},
  {id:4,name:"Шарска",price:220},
  {id:5,name:"Ребро",price:240},
  {id:6,name:"Колбас",price:100},
  {id:7,name:"Стек",price:170},
  {id:8,name:"Батак",price:170},
  {id:9,name:"Крилца",price:240},
  {id:10,name:"Суво месо",price:120},
  {id:11,name:"Пафлак",price:220}
 ],
 "Гарнир":[
  {id:12,name:"Помфрит",price:130}
 ]
};

// ===== DATA =====
let masi = JSON.parse(localStorage.getItem("masi")) ||
 Array.from({length:8},(_,i)=>({broj:i+1,naracki:[]}));

let inventory = JSON.parse(localStorage.getItem("inventory")) || {};
let current=0;

// ===== ПРОМЕТ =====
function todayKey(){return "promet-"+new Date().toISOString().slice(0,10);}
function getPromet(){return Number(localStorage.getItem(todayKey()))||0;}
function addPromet(x){localStorage.setItem(todayKey(),getPromet()+x);renderPromet();}
function renderPromet(){promet.innerText=getPromet();}
renderPromet();

// ===== МАСИ =====
function renderMasi(){
 masiDiv.innerHTML="";
 masi.forEach((m,i)=>{
  let d=document.createElement("div");
  d.className="masa"+(m.naracki.length?" zafatena":"");
  d.innerText="Маса "+m.broj;
  d.onclick=()=>openMasa(i);
  masiDiv.appendChild(d);
 });
}
const masiDiv=document.getElementById("masi");
renderMasi();

function openMasa(i){
 current=i;
 screenMasi.style.display="none";
 screenMasa.style.display="block";
 masaTitle.innerText="Маса "+masi[i].broj;
 renderMasa();
}
function backToMasi(){save();screenMasa.style.display="none";screenMasi.style.display="block";renderMasi();}

// ===== МЕНИ =====
function openMenu(){screenMasa.style.display="none";screenMenu.style.display="block";renderMenu();}
function backToMasa(){screenMenu.style.display="none";screenMasa.style.display="block";renderMasa();}

function renderMenu(){
 menuDiv.innerHTML="";
 Object.keys(menu).forEach(cat=>{
  menuDiv.innerHTML+=`<div class="dropdown" onclick="this.classList.toggle('open')">${cat}</div><div class="dropdown-items"></div>`;
  let c=menuDiv.lastElementChild;
  menu[cat].forEach(it=>{
   c.innerHTML+=`<button class="green" onclick="addItem(${it.id})">${it.name}<br>${it.price} ден</button>`;
  });
 });
}
const menuDiv=document.getElementById("menu");

function addItem(id){
 let masa=masi[current];
 let item;
 for(let c in menu){ item=menu[c].find(x=>x.id===id); if(item)break;}
 let n=masa.naracki.find(x=>x.id===id);
 if(n)n.qty++; else masa.naracki.push({...item,qty:1});
 save();renderMasa();
}

// ===== МАСА =====
function renderMasa(){
 items.innerHTML="";
 let t=0;
 masi[current].naracki.forEach((n,i)=>{
  t+=n.qty*n.price;
  items.innerHTML+=`
   <div class="item">
    ${n.name} (${n.price}) 
    <button onclick="chg(${i},-1)">−</button>
    ${n.qty}
    <button onclick="chg(${i},1)">+</button>
    = ${n.qty*n.price}
   </div>`;
 });
 total.innerText=t;
}
function chg(i,d){
 let n=masi[current].naracki[i];
 n.qty+=d;
 if(n.qty<=0)masi[current].naracki.splice(i,1);
 save();renderMasa();
}

// ===== НАПЛАТА =====
function clearMasa(){
 if(!confirm("Наплата?"))return;
 let sum=0;
 masi[current].naracki.forEach(n=>{
  sum+=n.qty*n.price;

  // залиха
  if(inventory[n.id]){
   inventory[n.id].stock -= n.qty * inventory[n.id].sellQty;
  }
 });
 saveInventory();
 saveReport(masi[current].naracki);
 addPromet(sum);
 masi[current].naracki=[];
 save();backToMasi();
}

// ===== POPIS =====
function openInventory(){
 screenReport.style.display="none";
 screenInventory.style.display="block";
 renderInventory();
}
function backFromInventory(){
 screenInventory.style.display="none";
 screenReport.style.display="block";
}

function renderInventory(){
 inventoryContent.innerHTML="";
 Object.keys(menu).forEach(cat=>{
  menu[cat].forEach(it=>{
   if(!inventory[it.id]){
    inventory[it.id]={unit:"парче",stock:0,buy:0,sellQty:1};
   }
   let i=inventory[it.id];
   inventoryContent.innerHTML+=`
    <div class="item">
     <b>${it.name}</b><br>
     Тип:
     <select onchange="iU(${it.id},this.value)">
      <option ${i.unit=="парче"?"selected":""}>парче</option>
      <option ${i.unit=="грами"?"selected":""}>грами</option>
     </select><br>
     Залиха: <input type="number" value="${i.stock}" onchange="iS(${it.id},this.value)"><br>
     Набавна цена: <input type="number" value="${i.buy}" onchange="iB(${it.id},this.value)"><br>
     Се продава: <input type="number" value="${i.sellQty}" onchange="iQ(${it.id},this.value)"> ${i.unit}
    </div>`;
  });
 });
 saveInventory();
}
function iU(id,v){inventory[id].unit=v;saveInventory();}
function iS(id,v){inventory[id].stock=Number(v);saveInventory();}
function iB(id,v){inventory[id].buy=Number(v);saveInventory();}
function iQ(id,v){inventory[id].sellQty=Number(v);saveInventory();}
function saveInventory(){localStorage.setItem("inventory",JSON.stringify(inventory));}

// ===== ИЗВЕШТАЈ =====
function reportKey(d){return "report-"+d;}

function saveReport(items){
 let d=new Date().toISOString().slice(0,10);
 let data=JSON.parse(localStorage.getItem(reportKey(d)))||{};
 items.forEach(n=>{
  let cat=""; for(let c in menu){if(menu[c].some(i=>i.id===n.id))cat=c;}
  if(!data[cat])data[cat]={};
  if(!data[cat][n.name])data[cat][n.name]={qty:0,sum:0,profit:0};

  let inv=inventory[n.id];
  let cost=inv?inv.buy*n.qty:0;

  data[cat][n.name].qty+=n.qty;
  data[cat][n.name].sum+=n.qty*n.price;
  data[cat][n.name].profit+=n.qty*n.price-cost;
 });
 localStorage.setItem(reportKey(d),JSON.stringify(data));
}

function openReport(){
 screenMasi.style.display="none";
 screenReport.style.display="block";
 reportDate.value=new Date().toISOString().slice(0,10);
 renderReport();
}
function backFromReport(){
 screenReport.style.display="none";
 screenMasi.style.display="block";
}

function renderReport(){
 reportContent.innerHTML="";
 let d=reportDate.value;
 let data=JSON.parse(localStorage.getItem(reportKey(d)));
 if(!data){reportContent.innerHTML="Нема податоци";return;}
 for(let c in data){
  reportContent.innerHTML+=`<h3>${c}</h3>`;
  for(let i in data[c]){
   let x=data[c][i];
   reportContent.innerHTML+=`
    <div class="item">
     ${i} | ${x.qty} × | ${x.sum} ден <br>
     Профит: <b>${x.profit} ден</b>
    </div>`;
  }
 }
}

function save(){localStorage.setItem("masi",JSON.stringify(masi));}
</script>

</body>
</html>
