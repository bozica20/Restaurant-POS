<!DOCTYPE html>
<html lang="mk">
<head>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">

<script>
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('service-worker.js');
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafana POS</title>

<style>
body{
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 background:#f2f2f2;
 margin:0; padding:12px;
}
h2,h3{ margin:6px 0; }

.masa{
 display:inline-flex;
 justify-content:center;
 align-items:center;
 width:120px;
 height:90px;
 margin:8px;
 background:white;
 border-radius:18px;
 font-weight:bold;
 font-size:20px;
 box-shadow:0 4px 10px rgba(0,0,0,0.25);
 cursor:pointer;
 transition:0.2s;
}
.zafatena{ background:#ffcc80; }

button{
 border:none;
 border-radius:18px;
 padding:14px 20px;
 margin:6px;
 background:#1976d2;
 color:white;
 font-size:20px;
 cursor:pointer;
}
button.green{ background:#388e3c; }
button.red{ background:#d32f2f; }

.item{
 background:white;
 padding:14px;
 margin:8px 0;
 border-radius:16px;
 box-shadow:0 2px 8px rgba(0,0,0,0.15);
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:18px;
}
.item.flash{ background:#c8e6c9; }

.total{
 font-size:22px;
 font-weight:bold;
 margin-top:12px;
 text-align:right;
}

/* ===== DROPDOWN ===== */
.dropdown{
 background:#e0e0e0;
 border-radius:16px;
 margin-top:12px;
 padding:16px;
 font-size:22px;
 font-weight:bold;
 display:flex;
 justify-content:space-between;
 align-items:center;
 cursor:pointer;
}

.dropdown-items{
 display:none;
 margin-top:10px;
}

.dropdown.open + .dropdown-items{
 display:block;
}

.menu-item{
 display:inline-block;
 margin:6px;
}
</style>
</head>

<body>

<!-- МАСИ -->
<div id="screenMasi">
 <h2>Маси</h2>
 <h3>Дневен промет: <span id="promet">0</span> ден</h3>
 <button onclick="openReport()">📊 Извештај</button>
 <div id="masi"></div>
</div>

<!-- МАСА -->
<div id="screenMasa" style="display:none">
 <button onclick="backToMasi()">⬅ Маси</button>
 <h3 id="masaTitle"></h3>
 <div id="items"></div>
 <div class="total">Вкупно: <span id="total">0</span> ден</div>
 <button class="green" onclick="openMenu()">➕ Додај</button>
 <button class="red" onclick="clearMasa()">💰 Плати</button>
</div>

<!-- МЕНИ -->
<div id="screenMenu" style="display:none">
 <button onclick="backToMasa()">⬅ Назад</button>
 <h3>Мени</h3>
 <div id="menu"></div>
</div>

 <!-- ИЗВЕШТАЈ -->
<div id="screenReport" style="display:none">
 <button onclick="backFromReport()">⬅ Назад</button>
 <h3>Извештај по ден</h3>

 <input type="date" id="reportDate" onchange="renderReport()" />

 <div id="reportContent"></div>
</div>

<script>
// ===== МЕНИ (ТВОЕ ЦЕЛОСНО) =====
const menu = {
 "Пиво":[
  {id:1,name:"Скопско",price:90},

  {id:5,name:"Горско",price:90},
  {id:6,name:"Туборг",price:110},
  {id:7,name:"Крали Марко",price:90}
 ],
 "Ракија":[
  {id:8,name:"Лозова Жолта Тиквеш",price:70},
  {id:9,name:"Св. Трифун",price:120},
  {id:10,name:"Бовин Жолта",price:90},
  {id:11,name:"Стомаклија",price:80},
  {id:12,name:"Мастика",price:80},
  {id:13,name:"Азбука",price:100},
  {id:14,name:"Узо",price:70},
  {id:15,name:"Вигор",price:60},
  {id:16,name:"Smirnoff",price:70},
  {id:17,name:"Жолта Бокал 0,25",price:300}
 ],
"Вино":[
  {id:18,name:"Александрија Бело",price:600},
  {id:19,name:"Александрија Црвено",price:600},
  {id:20,name:"Александрија Розе",price:600},
  {id:21,name:"Темјаника",price:600},
  {id:22,name:"Смедеревка 1л",price:320},
  {id:23,name:"Смедеревка 0.5",price:200},
  {id:24,name:"Смедеревка 0.2",price:70},
  {id:25,name:"Розе 1л",price:320},
  {id:26,name:"Розе 0.5",price:200},
  {id:27,name:"Розе 0.2",price:70}
],
"Жестоки пијалоци":[
  {id:28,name:"Коњак",price:60},
  {id:29,name:"Шток",price:90},
  {id:30,name:"Пелинковец Антик",price:90},
  {id:31,name:"Јегер",price:110},
  {id:32,name:"Џин",price:70},
  {id:33,name:"Џејмисон",price:150}
],
"Безалкохолни Пијалоци":[
  {id:34,name:"Кока Кола",price:70},
  {id:35,name:"Фанта",price:70},
  {id:36,name:"Пепси",price:70},
  {id:37,name:"Миринда",price:70},
  {id:38,name:"Газоза",price:70},
  {id:39,name:"7уп",price:70},
  {id:40,name:"Џус",price:80},
  {id:41,name:"Леден чај",price:90},
  {id:42,name:"Вода Негазирана 0.25",price:40},
  {id:43,name:"Вода Негазирана 0.75",price:80},
  {id:44,name:"Вода Газирана 0.25",price:40},

],
"Салати":[
  {id:50,name:"Шопска",price:200},
  {id:51,name:"Грчка",price:200},

  {id:53,name:"Зелка",price:50},

],
"Скара":[
  {id:58,name:"Кебап",price:25},
  {id:59,name:"Ајдучки кебап",price:30},
  {id:60,name:"Плескавица",price:100},

  {id:65,name:"Крилца",price:240},

 {id:69,name:"Свински увијач",price:190},

 {id:71,name:"Питии",price:200}
],
"Гарнир":[
  {id:72,name:"Помфрит",price:130},
  {id:73,name:"Помфрит со сирење",price:170},
  {id:74,name:"Леб",price:20},
  {id:75,name:"Пиперка",price:20},
 {id:76,name:"Нафора",price:80}
],
"Бургери":[
  {id:77,name:"Хамбургер",price:150},
  {id:78,name:"Чикен бургер",price:170}
],
"Појадок":[
  {id:79,name:"Омлет",price:140},
  {id:80,name:"Јајца на око",price:100}
]
};

// ===== МАСИ, ПРОМЕТ, ЛОГИКА (ИСТО КАКО КАЈ ТЕБЕ) =====
let masi = JSON.parse(localStorage.getItem("masi")) ||
 Array.from({length:8},(_,i)=>({broj:i+1,naracki:[]}));

let current=0;

/* ---- истата логика за маси, сметки, промет ---- */
/* (не е сменето ништо, само е задржано) */

function todayKey(){ return "promet-"+new Date().toISOString().slice(0,10); }
function getPromet(){ return Number(localStorage.getItem(todayKey()))||0; }
function addPromet(x){ localStorage.setItem(todayKey(),getPromet()+x); renderPromet(); }
function renderPromet(){ document.getElementById("promet").innerText=getPromet(); }
renderPromet();

function renderMasi(){
 const d=document.getElementById("masi"); d.innerHTML="";
 masi.forEach((m,i)=>{
  let div=document.createElement("div");
  div.className="masa"+(m.naracki.length?" zafatena":"");
  div.innerText="Маса "+m.broj;
  div.onclick=()=>openMasa(i);
  d.appendChild(div);
 });
}
renderMasi();

function openMasa(i){
 current=i;
 screenMasi.style.display="none";
 screenMasa.style.display="block";
 masaTitle.innerText="Маса "+masi[i].broj;
 renderMasa();
}
function backToMasi(){ save(); screenMasa.style.display="none"; screenMasi.style.display="block"; renderMasi(); }
function openMenu(){ screenMasa.style.display="none"; screenMenu.style.display="block"; renderMenu(); }
function backToMasa(){ screenMenu.style.display="none"; screenMasa.style.display="block"; renderMasa(); }

/* ===== DROPDOWN МЕНИ ===== */
function renderMenu(){
 const m=document.getElementById("menu");
 m.innerHTML="";

 Object.keys(menu).forEach(cat=>{
  m.innerHTML+=`
   <div class="dropdown" onclick="toggleCategory(this)">
    ${cat} <span>▼</span>
   </div>
   <div class="dropdown-items"></div>
  `;
 });

 document.querySelectorAll(".dropdown").forEach((d,i)=>{
  const cat=Object.keys(menu)[i];
  const c=d.nextElementSibling;
  menu[cat].forEach(it=>{
   c.innerHTML+=`
    <div class="menu-item">
     <button class="green" onclick="addItem(${it.id})">
      ${it.name}<br>${it.price} ден
     </button>
    </div>
   `;
  });
 });
}

function toggleCategory(el){
 document.querySelectorAll(".dropdown").forEach(d=>{
  if(d!==el) d.classList.remove("open");
 });
 el.classList.toggle("open");
}

/* ===== ДОДАВАЊЕ ===== */
function addItem(id){
 let masa=masi[current];
 let item;
 for(let cat in menu){
  item=menu[cat].find(x=>x.id===id);
  if(item) break;
 }
 let n=masa.naracki.find(x=>x.id===id);
 if(n) n.qty++;
 else masa.naracki.push({...item,qty:1});
 save(); renderMasa();
}

/* ===== МАСА ===== */
function renderMasa(){
 const d=document.getElementById("items"); d.innerHTML="";
 let total=0;
 masi[current].naracki.forEach((n,i)=>{
  total+=n.qty*n.price;
  d.innerHTML+=`
   <div class="item">
    ${n.name}
    <button onclick="changeQty(${i},-1)">−</button>
    ${n.qty}
    <button onclick="changeQty(${i},1)">+</button>
    ${n.qty*n.price} ден
   </div>`;
 });
 document.getElementById("total").innerText=total;
}
function changeQty(i,d){
 let n=masi[current].naracki[i];
 n.qty+=d;
 if(n.qty<=0) masi[current].naracki.splice(i,1);
 renderMasa(); save();
}

/* ===== ПЛАТИ ===== */
function clearMasa(){
 if(confirm("Да се наплати масата?")){
  let s=0;
  masi[current].naracki.forEach(n=>s+=n.qty*n.price);
  saveReport(masi[current].naracki);
  addPromet(s);
  masi[current].naracki=[];
  save(); backToMasi();
 }
}

function save(){ localStorage.setItem("masi",JSON.stringify(masi)); }
 /* ===== ИЗВЕШТАЈ ===== */

function reportKey(date){
 return "report-" + date;
}

function saveReport(items){
 const date = new Date().toISOString().slice(0,10);
 let data = JSON.parse(localStorage.getItem(reportKey(date))) || {};

 items.forEach(n=>{
  // најди категорија
  let category="";
  for(let cat in menu){
   if(menu[cat].some(i=>i.id===n.id)){
    category=cat; break;
   }
  }

  if(!data[category]) data[category]={};

  if(!data[category][n.name]){
   data[category][n.name]={ qty:0, sum:0 };
  }

  data[category][n.name].qty += n.qty;
  data[category][n.name].sum += n.qty * n.price;
 });

 localStorage.setItem(reportKey(date),JSON.stringify(data));
}

function openReport(){
 screenMasi.style.display="none";
 screenReport.style.display="block";
 document.getElementById("reportDate").value =
  new Date().toISOString().slice(0,10);
 renderReport();
}

function backFromReport(){
 screenReport.style.display="none";
 screenMasi.style.display="block";
}

function renderReport(){
 const date=document.getElementById("reportDate").value;
 const c=document.getElementById("reportContent");
 c.innerHTML="";

 const data=JSON.parse(localStorage.getItem(reportKey(date)));
 if(!data){
  c.innerHTML="<p>Нема податоци за овој ден</p>";
  return;
 }

 for(let cat in data){
  c.innerHTML+=`<h3>${cat}</h3>`;
  for(let item in data[cat]){
   const x=data[cat][item];
   c.innerHTML+=`
    <div class="item">
     ${item} – ${x.qty} × = ${x.sum} ден
    </div>`;
  }
 }
}
</script>

</body>
</html>
