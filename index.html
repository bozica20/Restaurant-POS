<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafana POS</title>

<style>
body{font-family:sans-serif;background:#f2f2f2;margin:0;padding:12px}
h2,h3{margin:6px 0}
.masa{display:inline-flex;justify-content:center;align-items:center;width:120px;height:90px;margin:8px;background:white;border-radius:18px;font-weight:bold;font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,.25);cursor:pointer}
.zafatena{background:#ffcc80}
button{border:none;border-radius:18px;padding:14px 20px;margin:6px;background:#1976d2;color:white;font-size:18px}
.green{background:#388e3c}
.red{background:#d32f2f}
.item{background:white;padding:12px;margin:6px 0;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.total{font-size:22px;font-weight:bold;text-align:right}
input,select{padding:6px;margin:3px}
</style>
</head>

<body>

<!-- МАСИ -->
<div id="screenMasi">
<h2>Маси</h2>
<h3>Дневен промет: <span id="promet">0</span> ден</h3>
<button onclick="openReport()">📊 Извештај</button>
<button onclick="openInventory()">📋 Попис</button>
<div id="masi"></div>
</div>

<!-- МАСА -->
<div id="screenMasa" style="display:none">
<button onclick="backToMasi()">⬅ Маси</button>
<h3 id="masaTitle"></h3>
<div id="items"></div>
<div class="total">Вкупно: <span id="total">0</span> ден</div>
<button class="green" onclick="openMenu()">➕ Додај</button>
<button class="red" onclick="pay()">💰 Плати</button>
</div>

<!-- МЕНИ -->
<div id="screenMenu" style="display:none">
<button onclick="backToMasa()">⬅ Назад</button>
<h3>Мени</h3>
<div id="menu"></div>
</div>

<!-- ИЗВЕШТАЈ -->
<div id="screenReport" style="display:none">
<button onclick="backFromReport()">⬅ Назад</button>
<h3>Дневен извештај</h3>
<div id="report"></div>
</div>

<!-- ПОПИС -->
<div id="screenInventory" style="display:none">
<button onclick="backFromInventory()">⬅ Назад</button>
<h3>📋 Попис</h3>
<div id="inventory"></div>
</div>

<script>
// ===== МЕНИ (НЕ СЕ МЕНУВА) =====
const menu = {
 "Пиво":[{id:1,name:"Скопско",price:90}],
 "Скара":[{id:57,name:"Кебап",price:25}]
};

// ===== ПОДАТОЦИ =====
let masi = Array.from({length:8},(_,i)=>({broj:i+1,naracki:[]}));
let inventory = JSON.parse(localStorage.getItem("inventory")) || {};
let report = JSON.parse(localStorage.getItem("report")) || {promet:0,trosok:0,profit:0};
let current=0;

// ===== МАСИ =====
function renderMasi(){
 const d=masiDiv=document.getElementById("masi");d.innerHTML="";
 masi.forEach((m,i)=>{
  let div=document.createElement("div");
  div.className="masa"+(m.naracki.length?" zafatena":"");
  div.innerText="Маса "+m.broj;
  div.onclick=()=>openMasa(i);
  d.appendChild(div);
 });
}
renderMasi();

function openMasa(i){
 current=i;
 screenMasi.style.display="none";
 screenMasa.style.display="block";
 masaTitle.innerText="Маса "+masi[i].broj;
 renderMasa();
}
function backToMasi(){screenMasa.style.display="none";screenMasi.style.display="block";renderMasi();}
function openMenu(){screenMasa.style.display="none";screenMenu.style.display="block";renderMenu();}
function backToMasa(){screenMenu.style.display="none";screenMasa.style.display="block";}

// ===== МЕНИ =====
function renderMenu(){
 const d=document.getElementById("menu");d.innerHTML="";
 for(let cat in menu){
  d.innerHTML+=`<h3>${cat}</h3>`;
  menu[cat].forEach(it=>{
   d.innerHTML+=`<button class="green" onclick="addItem(${it.id})">${it.name}<br>${it.price} ден</button>`;
  });
 }
}
function addItem(id){
 let it;
 for(let cat in menu){it=menu[cat].find(x=>x.id===id);if(it)break;}
 let n=masi[current].naracki.find(x=>x.id===id);
 if(n)n.qty++; else masi[current].naracki.push({...it,qty:1});
 renderMasa();
}

// ===== МАСА =====
function renderMasa(){
 const d=document.getElementById("items");d.innerHTML="";
 let t=0;
 masi[current].naracki.forEach((n,i)=>{
  t+=n.qty*n.price;
  d.innerHTML+=`<div class="item">${n.name} ${n.qty} × ${n.price} = ${n.qty*n.price} ден</div>`;
 });
 total.innerText=t;
}

// ===== ПЛАЌАЊЕ =====
function pay(){
 let sum=0,trosok=0;
 masi[current].naracki.forEach(n=>{
  sum+=n.qty*n.price;
  const inv=inventory[n.id];
  if(inv){
   trosok+=inv.buyPrice*n.qty;
   inv.stock-=inv.sellQty*n.qty;
  }
 });
 report.promet+=sum;
 report.trosok+=trosok;
 report.profit+=sum-trosok;
 localStorage.setItem("inventory",JSON.stringify(inventory));
 localStorage.setItem("report",JSON.stringify(report));
 masi[current].naracki=[];
 backToMasi();
}

// ===== ПОПИС =====
function openInventory(){
 screenMasi.style.display="none";
 screenInventory.style.display="block";
 renderInventory();
}
function backFromInventory(){
 screenInventory.style.display="none";
 screenMasi.style.display="block";
}
function renderInventory(){
 const d=document.getElementById("inventory");d.innerHTML="";
 for(let cat in menu){
  menu[cat].forEach(it=>{
   if(!inventory[it.id]){
    inventory[it.id]={name:it.name,unit:"парче",sellQty:1,stock:0,buyPrice:0,sellPrice:it.price};
   }
   const i=inventory[it.id];
   d.innerHTML+=`
    <div class="item">
     <b>${i.name}</b><br>
     Тип:
     <select onchange="inventory[${it.id}].unit=this.value">
      <option ${i.unit==="парче"?"selected":""}>парче</option>
      <option ${i.unit==="грами"?"selected":""}>грами</option>
     </select><br>
     Се продава: <input type="number" value="${i.sellQty}" onchange="inventory[${it.id}].sellQty=this.value"><br>
     Набавна цена: <input type="number" value="${i.buyPrice}" onchange="inventory[${it.id}].buyPrice=this.value"><br>
     Залиха: <input type="number" value="${i.stock}" onchange="inventory[${it.id}].stock=this.value">
    </div>`;
  });
 }
 localStorage.setItem("inventory",JSON.stringify(inventory));
}

// ===== ИЗВЕШТАЈ =====
function openReport(){
 screenMasi.style.display="none";
 screenReport.style.display="block";
 reportDiv.innerHTML=`
  <div class="item">Промет: ${report.promet} ден</div>
  <div class="item">Трошок: ${report.trosok} ден</div>
  <div class="item"><b>Профит: ${report.profit} ден</b></div>`;
}
function backFromReport(){
 screenReport.style.display="none";
 screenMasi.style.display="block";
}
</script>
</body>
</html>
