<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafana POS + Попис</title>
<style>
body{ font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#f2f2f2; margin:0; padding:12px; }
h2,h3{ margin:6px 0; }
.masa{ display:inline-flex; justify-content:center; align-items:center; width:120px; height:90px; margin:8px; background:white; border-radius:18px; font-weight:bold; font-size:20px; box-shadow:0 4px 10px rgba(0,0,0,0.25); cursor:pointer; transition:0.2s; }
.zafatena{ background:#ffcc80; }
button{ border:none; border-radius:18px; padding:14px 20px; margin:6px; background:#1976d2; color:white; font-size:20px; cursor:pointer; }
button.green{ background:#388e3c; }
button.red{ background:#d32f2f; }
.item{ background:white; padding:14px; margin:8px 0; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,0.15); display:flex; justify-content:space-between; align-items:center; font-size:18px; }
.total{ font-size:22px; font-weight:bold; margin-top:12px; text-align:right; }
.dropdown{ background:#e0e0e0; border-radius:16px; margin-top:12px; padding:16px; font-size:22px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.dropdown-items{ display:none; margin-top:10px; }
.dropdown.open + .dropdown-items{ display:block; }
.menu-item{ display:inline-block; margin:6px; }
input[type=number], input[type=text], select{ font-size:16px; padding:4px; border-radius:6px; border:1px solid #ccc; margin:2px; }
table{ width:100%; border-collapse: collapse; margin-top:12px; }
th,td{ border:1px solid #ccc; padding:6px; text-align:center; }
th{ background:#ddd; }
</style>
</head>
<body>

<!-- МАСИ -->
<div id="ekranMasi">
 <h2>Маси</h2>
 <h3>Дневен промет: <span id="promet">0</span> ден</h3>
 <button onclick="otvoriPopis()">📦 Попис / Додај артикл</button>
 <div id="masi"></div>
</div>

<!-- МАСА -->
<div id="ekranMasa" style="display:none">
 <button onclick="nazadMasi()">⬅ Маси</button>
 <h3 id="imeMasa"></h3>
 <div id="artikli"></div>
 <div class="total">Вкупно: <span id="total">0</span> ден</div>
 <button class="green" onclick="otvoriMeni()">➕ Додај</button>
 <button class="red" onclick="naplatiMasa()">💰 Плати</button>
</div>

<!-- МЕНИ -->
<div id="ekranMeni" style="display:none">
 <button onclick="nazadMasa()">⬅ Назад</button>
 <h3>Мени</h3>
 <div id="meni"></div>
</div>

<!-- ПОПИС -->
<div id="ekranPopis" style="display:none">
  <button onclick="nazadPopis()">⬅ Назад</button>
  <h3>Попис / Инвентар</h3>
  <div id="sodrzinaPopis"></div>

  <h3>Додај нов артикл</h3>
  <div>
    Име: <input type="text" id="novoIme">
    Тип: <select id="novoUnit">
      <option value="pcs">Парче</option>
      <option value="kg">Килограм</option>
    </select>
    Количина: <input type="number" id="novoQty" value="1" min="0">
    Цена на купување: <input type="number" id="novoCost" value="0" min="0">
    Цена на продажба: <input type="number" id="novoPrice" value="0" min="0">
    <span id="novoPortionContainer" style="display:none;">
      Дел за продажба (kg): <input type="number" id="novoPortion" value="0.1" step="0.1" min="0">
    </span>
    <button onclick="dodadiNovArtikl()">➕ Додај</button>
  </div>
</div>

<script>
// ===== ПРИМЕР МЕНИ: ПИЈАЛАЦИ И СКАРА =====
const meni = {
 "Пиво":[
   {id:1,name:"Скопско",price:90,unit:"pcs"},
   {id:2,name:"Скопско Смус",price:90,unit:"pcs"}
 ],
 "Скара":[
   {id:57,name:"Кебап",price:120,unit:"kg",salePerPortion:0.4},
   {id:58,name:"Ајдучки кебап",price:150,unit:"kg",salePerPortion:0.4}
 ]
};

// ===== ПОПИС =====
let popis = JSON.parse(localStorage.getItem("popis")) || {};
// автоматски ги додава артиклите од мени ако нема во попис
for(let kat in meni){
  meni[kat].forEach(it=>{
    if(!popis[it.name]){
      if(it.unit=="pcs") popis[it.name]={qty:50,sold:0,revenue:0,price:it.price,costPerUnit:it.price,unit:"pcs"};
      else popis[it.name]={qty:5,sold:0,revenue:0,price:it.price,costPerKg:it.price,salePerPortion:it.salePerPortion,unit:"kg"};
    }
  });
}
function sacuvajPopis(){ localStorage.setItem("popis",JSON.stringify(popis)); }

// ===== МАСИ =====
let masi = JSON.parse(localStorage.getItem("masi")) || Array.from({length:8},(_,i)=>({broj:i+1,naracki:[]}));
let tekovna=0;

// ===== ПРОМЕТ =====
function klucPromet(){ return "promet-"+new Date().toISOString().slice(0,10); }
function dobijPromet(){ return Number(localStorage.getItem(klucPromet()))||0; }
function dodadiPromet(x){ localStorage.setItem(klucPromet(),dobijPromet()+x); prikaziPromet(); }
function prikaziPromet(){ document.getElementById("promet").innerText=dobijPromet(); }
prikaziPromet();

// ===== РЕНДЕР МАСИ =====
function prikaziMasi(){
  const d=document.getElementById("masi"); d.innerHTML="";
  masi.forEach((m,i)=>{
    let div=document.createElement("div");
    div.className="masa"+(m.naracki.length?" zafatena":"");
    div.innerText="Маса "+m.broj;
    div.onclick=()=>otvoriMasa(i);
    d.appendChild(div);
  });
}
prikaziMasi();

// ===== МАСА =====
function otvoriMasa(i){ tekovna=i; ekranMasi.style.display="none"; ekranMasa.style.display="block"; document.getElementById("imeMasa").innerText="Маса "+masi[i].broj; prikaziMasaArtikli(); }
function nazadMasi(){ sacuvaj(); ekranMasa.style.display="none"; ekranMasi.style.display="block"; prikaziMasi(); }
function otvoriMeni(){ ekranMasa.style.display="none"; ekranMeni.style.display="block"; prikaziMeni(); }
function nazadMasa(){ ekranMeni.style.display="none"; ekranMasa.style.display="block"; prikaziMasaArtikli(); }

// ===== РЕНДЕР МЕНИ =====
function prikaziMeni(){
  const m=document.getElementById("meni"); m.innerHTML="";
  Object.keys(meni).forEach(kat=>{
    m.innerHTML+=`<div class="dropdown" onclick="otvoriKategorija(this)">${kat} ▼</div><div class="dropdown-items"></div>`;
  });
  document.querySelectorAll(".dropdown").forEach((d,i)=>{
    const kat=Object.keys(meni)[i]; const c=d.nextElementSibling;
    meni[kat].forEach(it=>{
      c.innerHTML+=`<div class="menu-item"><button class="green" onclick="dodadiArtikl(${it.id})">${it.name}<br>${it.price} ден</button></div>`;
    });
  });
}
function otvoriKategorija(el){ document.querySelectorAll(".dropdown").forEach(d=>{if(d!==el)d.classList.remove("open");}); el.classList.toggle("open"); }

// ===== ДОДАВАЊЕ АРТИКЛИ ВО МАСА =====
function dodadiArtikl(id){
  let masa=masi[tekovna]; let item;
  for(let kat in meni){ item=meni[kat].find(x=>x.id===id); if(item) break; }
  let n=masa.naracki.find(x=>x.id===id);
  
  // ПРОВЕРКА ЗАЛИХА
  let stoc = popis[item.name];
  if(item.unit=="pcs" && stoc.qty<1){ alert(item.name+" нема на залиха!"); return; }
  if(item.unit=="kg" && stoc.qty<stoc.salePerPortion){ alert(item.name+" нема доволно на залиха!"); return; }

  if(n) n.qty++; else masa.naracki.push({...item, qty:1});

  // АЖУРИРАЈ ПОПИС
  if(item.unit=="pcs"){ stoc.qty-=1; stoc.sold+=1; stoc.revenue+=item.price; }
  else if(item.unit=="kg"){ stoc.qty-=stoc.salePerPortion; stoc.sold+=1; stoc.revenue+=item.price; }

  sacuvajPopis(); prikaziMasaArtikli();
}

// ===== МАСА =====
function prikaziMasaArtikli(){
  const d=document.getElementById("artikli"); d.innerHTML="";
  let total=0;
  masi[tekovna].naracki.forEach((n,i)=>{
    total+=n.qty*n.price;
    d.innerHTML+=`<div class="item">${n.name}<button onclick="promeniKolicina(${i},-1)">−</button>${n.qty}<button onclick="promeniKolicina(${i},1)">+</button>${n.qty*n.price} ден</div>`;
  });
  document.getElementById("total").innerText=total;
}
function promeniKolicina(i,d){
  let n=masi[tekovna].naracki[i];
  let stoc = popis[n.name];
  if(d>0){ // додај
    if(n.unit=="pcs" && stoc.qty<1){ alert(n.name+" нема на залиха!"); return; }
    if(n.unit=="kg" && stoc.qty<stoc.salePerPortion){ alert(n.name+" нема доволно на залиха!"); return; }
    n.qty+=1;
    if(n.unit=="pcs"){ stoc.qty-=1; stoc.sold+=1; stoc.revenue+=n.price; }
    else{ stoc.qty-=stoc.salePerPortion; stoc.sold+=1; stoc.revenue+=n.price; }
  } else { // одземај
    n.qty-=1;
    if(n.unit=="pcs"){ stoc.qty+=1; stoc.sold-=1; stoc.revenue-=n.price; }
    else{ stoc.qty+=stoc.salePerPortion; stoc.sold-=1; stoc.revenue-=n.price; }
    if(n.qty<=0) masi[tekovna].naracki.splice(i,1);
  }
  sacuvajPopis(); prikaziMasaArtikli();
}

// ===== ПЛАТИ =====
function naplatiMasa(){
  if(confirm("Да се наплати масата?")){
    let suma=0; masi[tekovna].naracki.forEach(n=>suma+=n.qty*n.price);
    dodadiPromet(suma);
    masi[tekovna].naracki=[];
    sacuvaj(); prikaziMasi();
    ekranMasa.style.display="none"; ekranMasi.style.display="block";
  }
}

// ===== ПОПИС =====
const unitSelect = document.getElementById("novoUnit");
const portionContainer = document.getElementById("novoPortionContainer");
unitSelect.onchange = ()=> {
  if(unitSelect.value=="kg") portionContainer.style.display="inline";
  else portionContainer.style.display="none";
};

function otvoriPopis(){ ekranMasi.style.display="none"; ekranPopis.style.display="block"; prikaziPopis(); }
function nazadPopis(){ ekranPopis.style.display="none"; ekranMasi.style.display="block"; }
function prikaziPopis(){
  const c=document.getElementById("sodrzinaPopis"); c.innerHTML="";
  for(let kat in meni){
    c.innerHTML+=`<h3>${kat}</h3><table><tr><th>Артикл</th><th>Тип</th><th>Залиха</th><th>Продадено</th><th>Приход</th><th>Трошок</th><th>Профит</th></tr>`;
    meni[kat].forEach(it=>{
      const s=popis[it.name];
      let trosok=0;
      if(s.unit=="pcs") trosok=s.sold*s.costPerUnit;
      else trosok=s.sold*s.salePerPortion*s.costPerKg;
      let profit=s.revenue-trosok;
      c.innerHTML+=`<tr>
        <td>${it.name}</td><td>${s.unit}</td>
        <td><input type="number" value="${s.qty}" min="0" onchange="promeniPopis('${it.name}',this.value)"></td>
        <td>${s.sold}</td><td>${s.revenue}</td><td>${trosok}</td><td>${profit}</td>
      </tr>`;
    });
    c.innerHTML+="</table>";
  }
}

function promeniPopis(ime,val){ popis[ime].qty=Number(val); sacuvajPopis(); }

function dodadiNovArtikl(){
  const ime = document.getElementById("novoIme").value.trim();
  const unit = document.getElementById("novoUnit").value;
  const qty = Number(document.getElementById("novoQty").value);
  const cost = Number(document.getElementById("novoCost").value);
  const price = Number(document.getElementById("novoPrice").value);
  const portion = Number(document.getElementById("novoPortion").value);

  if(!ime || qty<=0 || cost<0 || price<0){ alert("Пополнете ги сите полиња!"); return; }
  if(popis[ime]){ alert("Артиклот веќе постои!"); return; }

  if(unit=="pcs"){
    popis[ime]={qty:qty,sold:0,revenue:0,price:price,costPerUnit:cost,unit:"pcs"};
  } else {
    popis[ime]={qty:qty,sold:0,revenue:0,price:price,costPerKg:cost,salePerPortion:portion,unit:"kg"};
  }
  sacuvajPopis(); prikaziPopis();
  alert("Артикл додаден!");
}

// ===== ЗАЧУВАЈ =====
function sacuvaj(){ localStorage.setItem("masi",JSON.stringify(masi)); }
prikaziMasi();
</script>

</body>
</html>
