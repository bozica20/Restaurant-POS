<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafana POS</title>

<style>
body{
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 background:#f2f2f2;
 margin:0; padding:12px;
}
h2,h3{ margin:6px 0; }
.masa{
 display:inline-flex;
 justify-content:center;
 align-items:center;
 width:120px;
 height:90px;
 margin:8px;
 background:white;
 border-radius:18px;
 font-weight:bold;
 font-size:20px;
 box-shadow:0 4px 10px rgba(0,0,0,0.25);
 cursor:pointer;
 transition:0.2s;
}
.zafatena{ background:#ffcc80; }
button{
 border:none;
 border-radius:18px;
 padding:14px 20px;
 margin:6px;
 background:#1976d2;
 color:white;
 font-size:20px;
 cursor:pointer;
}
button.green{ background:#388e3c; }
button.red{ background:#d32f2f; }
.item{
 background:white;
 padding:14px;
 margin:8px 0;
 border-radius:16px;
 box-shadow:0 2px 8px rgba(0,0,0,0.15);
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:18px;
}
.item.flash{ background:#c8e6c9; }
.total{
 font-size:22px;
 font-weight:bold;
 margin-top:12px;
 text-align:right;
}
.dropdown{
 background:#e0e0e0;
 border-radius:16px;
 margin-top:12px;
 padding:16px;
 font-size:22px;
 font-weight:bold;
 display:flex;
 justify-content:space-between;
 align-items:center;
 cursor:pointer;
}
.dropdown-items{
 display:none;
 margin-top:10px;
}
.dropdown.open + .dropdown-items{
 display:block;
}
.menu-item{
 display:inline-block;
 margin:6px;
}
</style>
</head>
<body>

<!-- МАСИ -->
<div id="screenMasi">
 <h2>Маси</h2>
 <h3>Дневен промет: <span id="promet">0</span> ден</h3>
 <button onclick="openReport()">📊 Извештај</button>
 <div id="masi"></div>
</div>

<!-- МАСА -->
<div id="screenMasa" style="display:none">
 <button onclick="backToMasi()">⬅ Маси</button>
 <h3 id="masaTitle"></h3>
 <div id="items"></div>
 <div class="total">Вкупно: <span id="total">0</span> ден</div>
 <button class="green" onclick="openMenu()">➕ Додај</button>
 <button class="red" onclick="clearMasa()">💰 Плати</button>
</div>

<!-- МЕНИ -->
<div id="screenMenu" style="display:none">
 <button onclick="backToMasa()">⬅ Назад</button>
 <h3>Мени</h3>
 <div id="menu"></div>
</div>

<!-- ИЗВЕШТАЈ -->
<div id="screenReport" style="display:none">
 <button onclick="backFromReport()">⬅ Назад</button>
 <h3>Извештај по ден</h3>
 <input type="date" id="reportDate" onchange="renderReport()" />
 <div id="reportContent"></div>
</div>

const db = firebase.database();

// ===== МЕНИ =====

 ],
 "Бургери":[

 ],

};

// ===== ИНИЦИЈАЛИЗАЦИЈА НА МАСИ И ПРОМЕТ =====
let masi=[], current=0;

// Real-time listener за масите
db.ref("masi").on("value", snapshot=>{
  if(snapshot.exists()) masi = snapshot.val();
  else {
    masi = Array.from({length:8},(_,i)=>({broj:i+1,naracki:[]}));
    db.ref("masi").set(masi);
  }
  renderMasi();
});

// Промет
function renderPromet(){
  db.ref("promet/"+todayKey()).get().then(s=>{
    document.getElementById("promet").innerText = s.exists()? s.val():0;
  });
}
renderPromet();

function todayKey(){ return new Date().toISOString().slice(0,10); }

// ===== РЕНДЕР МАСИ =====
function renderMasi(){
 const d=document.getElementById("masi"); d.innerHTML="";
 masi.forEach((m,i)=>{
  let div=document.createElement("div");
  div.className="masa"+(m.naracki.length?" zafatena":"");
  div.innerText="Маса "+m.broj;
  div.onclick=()=>openMasa(i);
  d.appendChild(div);
 });
}

function openMasa(i){
 current=i;
 screenMasi.style.display="none";
 screenMasa.style.display="block";
 masaTitle.innerText="Маса "+masi[i].broj;
 renderMasa();
}
function backToMasi(){ saveMasi(); screenMasa.style.display="none"; screenMasi.style.display="block"; renderMasi(); }
function openMenu(){ screenMasa.style.display="none"; screenMenu.style.display="block"; renderMenu(); }
function backToMasa(){ screenMenu.style.display="none"; screenMasa.style.display="block"; renderMasa(); }

// ===== МЕНИ =====
function renderMenu(){
 const m=document.getElementById("menu"); m.innerHTML="";
 Object.keys(menu).forEach(cat=>{
   m.innerHTML+=`<div class="dropdown" onclick="toggleCategory(this)">${cat} <span>▼</span></div><div class="dropdown-items"></div>`;
 });
 document.querySelectorAll(".dropdown").forEach((d,i)=>{
   const cat=Object.keys(menu)[i];
   const c=d.nextElementSibling;
   menu[cat].forEach(it=>{
     c.innerHTML+=`<div class="menu-item"><button class="green" onclick="addItem(${it.id})">${it.name}<br>${it.price} ден</button></div>`;
   });
 });
}

function toggleCategory(el){ document.querySelectorAll(".dropdown").forEach(d=>{ if(d!==el)d.classList.remove("open"); }); el.classList.toggle("open"); }

function addItem(id){
 let masa=masi[current], item;
 for(let cat in menu){ item=menu[cat].find(x=>x.id===id); if(item) break; }
 let n=masa.naracki.find(x=>x.id===id);
 if(n) n.qty++; else masa.naracki.push({...item,qty:1});
 saveMasi(); renderMasa();
}

function renderMasa(){
 const d=document.getElementById("items"); d.innerHTML="";
 let total=0;
 masi[current].naracki.forEach((n,i)=>{
   total+=n.qty*n.price;
   d.innerHTML+=`<div class="item">${n.name}<button onclick="changeQty(${i},-1)">−</button>${n.qty}<button onclick="changeQty(${i},1)">+</button>${n.qty*n.price} ден</div>`;
 });
 document.getElementById("total").innerText=total;
}

function changeQty(i,d){ 
 let n=masi[current].naracki[i]; 
 n.qty+=d; 
 if(n.qty<=0) masi[current].naracki.splice(i,1); 
 renderMasa(); 
 saveMasi(); 
}

// ===== ПЛАТИ =====
function clearMasa(){
 if(confirm("Да се наплати масата?")){
  let s=0;
  masi[current].naracki.forEach(n=>s+=n.qty*n.price);
  saveReport(masi[current].naracki);
  addPromet(s);
  masi[current].naracki=[];
  saveMasi(); backToMasi();
 }
}

function saveMasi(){ db.ref("masi").set(masi); }

function addPromet(x){
 const ref=db.ref("promet/"+todayKey());
 ref.get().then(s=>{ ref.set((s.exists()?s.val():0)+x).then(renderPromet); });
}

// ===== ИЗВЕШТАЈ =====
function saveReport(items){
 const date = todayKey();
 const ref = db.ref("report-"+date);
 ref.get().then(s=>{
   let data = s.exists()? s.val():{};
   items.forEach(n=>{
     let category=""; for(let cat in menu){ if(menu[cat].some(i=>i.id===n.id)){category=cat; break;} }
     if(!data[category]) data[category]={};
     if(!data[category][n.name]) data[category][n.name]={qty:0,sum:0};
     data[category][n.name].qty += n.qty;
     data[category][n.name].sum += n.qty*n.price;
   });
   ref.set(data);
 });
}

function openReport(){ screenMasi.style.display="none"; screenReport.style.display="block"; document.getElementById("reportDate").value = todayKey(); renderReport(); }
function backFromReport(){ screenReport.style.display="none"; screenMasi.style.display="block"; }

function renderReport(){
 const date=document.getElementById("reportDate").value;
 const c=document.getElementById("reportContent"); c.innerHTML="";
 db.ref("report-"+date).get().then(snapshot=>{
   if(!snapshot.exists()){ c.innerHTML="<p>Нема податоци за овој ден</p>"; return; }
   const data=snapshot.val();
   for(let cat in data){
     c.innerHTML+=`<h3>${cat}</h3>`;
     for(let item in data[cat]){
       const x=data[cat][item];
       c.innerHTML+=`<div class="item">${item} – ${x.qty} × = ${x.sum} ден</div>`;
     }
   }
 });
}
</script>
